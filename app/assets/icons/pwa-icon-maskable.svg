<!--
  Streamify app mark — `purpose: "maskable"` variant. Generated into
  `public/icons/` by `npm run icons:pwa`; edit here, never the PNG.

  Two differences from `pwa-icon.svg`, both required by the spec:

  1. Full-bleed background, no rounded corners. Android (and any other
     consumer) applies its own mask — circle, squircle, rounded square,
     teardrop — so authoring corners here would get double-rounded or
     clipped into a visible seam.
  2. The glyph is scaled to 72% about the centre so it sits inside the
     "safe zone": the inner circle of 80% diameter (radius 204.8px on a
     512px canvas). Worst case here is a perforation corner at 192.5px
     from centre, which clears it.

  https://www.w3.org/TR/appmanifest/#purpose-member
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="512"
  height="512"
  viewBox="0 0 512 512"
  role="img"
  aria-label="Streamify"
>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5c7a" />
      <stop offset="0.5" stop-color="#ff335f" />
      <stop offset="1" stop-color="#d81b4a" />
    </linearGradient>

    <radialGradient id="sheen" cx="0.3" cy="0.14" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#tile)" />
  <rect width="512" height="512" fill="url(#sheen)" />

  <g transform="translate(256 256) scale(0.72) translate(-256 -256)">
    <g fill="#ffffff" fill-opacity="0.82">
      <rect x="34" y="107" width="26" height="34" rx="9" />
      <rect x="34" y="195" width="26" height="34" rx="9" />
      <rect x="34" y="283" width="26" height="34" rx="9" />
      <rect x="34" y="371" width="26" height="34" rx="9" />

      <rect x="452" y="107" width="26" height="34" rx="9" />
      <rect x="452" y="195" width="26" height="34" rx="9" />
      <rect x="452" y="283" width="26" height="34" rx="9" />
      <rect x="452" y="371" width="26" height="34" rx="9" />
    </g>

    <path
      d="M208 166 L356 256 L208 346 Z"
      fill="#ffffff"
      stroke="#ffffff"
      stroke-width="28"
      stroke-linejoin="round"
    />
  </g>
</svg>
