<!--
  Streamify app mark — iOS `apple-touch-icon` variant. Generated into
  `public/icons/` by `npm run icons:pwa`; edit here, never the PNG.

  iOS ignores the web app manifest's icons array for the home-screen icon
  and reads `<link rel="apple-touch-icon">` instead, with two constraints
  that make it its own file rather than a resize of `pwa-icon.svg`:

  1. No alpha. iOS composites transparent pixels onto black, so a rounded
     tile would get black corners. Background is full-bleed and opaque.
  2. No authored corners. iOS applies its own squircle (~22% corner
     radius), so the artwork is square and the glyph is scaled to 86% —
     large enough to fill the icon, inset enough to clear the mask.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="512"
  height="512"
  viewBox="0 0 512 512"
  role="img"
  aria-label="Streamify"
>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5c7a" />
      <stop offset="0.5" stop-color="#ff335f" />
      <stop offset="1" stop-color="#d81b4a" />
    </linearGradient>

    <radialGradient id="sheen" cx="0.3" cy="0.14" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#tile)" />
  <rect width="512" height="512" fill="url(#sheen)" />

  <g transform="translate(256 256) scale(0.86) translate(-256 -256)">
    <g fill="#ffffff" fill-opacity="0.82">
      <rect x="34" y="107" width="26" height="34" rx="9" />
      <rect x="34" y="195" width="26" height="34" rx="9" />
      <rect x="34" y="283" width="26" height="34" rx="9" />
      <rect x="34" y="371" width="26" height="34" rx="9" />

      <rect x="452" y="107" width="26" height="34" rx="9" />
      <rect x="452" y="195" width="26" height="34" rx="9" />
      <rect x="452" y="283" width="26" height="34" rx="9" />
      <rect x="452" y="371" width="26" height="34" rx="9" />
    </g>

    <path
      d="M208 166 L356 256 L208 346 Z"
      fill="#ffffff"
      stroke="#ffffff"
      stroke-width="28"
      stroke-linejoin="round"
    />
  </g>
</svg>
